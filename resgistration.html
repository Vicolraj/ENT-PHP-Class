<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Database</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            background-image: url(bg.jpg);
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .formContainer{
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            border: white 3px solid;
            box-shadow: 0px 10px 20px 5px black;
            color: white;
            border-radius: 20px;
            width: 30vw;
            display: flex;
            min-width: 400px;
            justify-content: center;
        }

        form{
            width: 90%;

        }

        input, button, label, select{
            width: 100%;
            height: 35px;
        }

        input{
            margin-bottom: 10px;
        }

        button{
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body onload="startup()">
    <div class="formContainer">
        <form id="regForm" method="post" action="dbsample.php">
            <label for="matric">Matric No: </label><br>
            <input required type="text" name="matric" id="matric"> <br />

            <label for="fullname">Fullname</label><br>
            <input name="fullname" required type="text" id="fullname"> <br />

            <label for="gender">Gender</label><br>
            <select required name="gender" id="gender">
                <option value="MALE">MALE</option>
                <option value="FEMALE">FEMALE</option> 
            </select required>
            <br />

            <label for="level">Level</label><br>
            <select name="level" required name="level" id="level">
                <option value="100">100 Level</option>
                <option value="200">200 Level</option>
                <option value="300">300 Level</option>
                <option value="400">400 Level</option>
                <option value="500">500 Level</option>
            </select required><br />

            <label for="deptcode">Department Code</label><br>
            <input name="deptcode" required type="text" maxlength="3" id="deptcode"><br>

            <label for="phoneno">Phone Number</label><br>
            <input name="phoneno" required type="tel" name="phoneno" id="phoneno"><br>

            <label for="email">Email</label><br>
            <input name="email" required type="email" id="email"> <br>

            <button  onclick="Submit()">Submit</button>
        </form>
    </div>

<table>
    <tr>
        <td>SN</td>
        <td>Matric NO</td>
        <td>Full Name</td>
        <td>Gender</td>
        <td>Level</td>
    </tr>
    <tbody>

    </tbody>
</table>



    <script>
        function Submit(){
             alert(document.getElementById('matric').value)
        }

        function startup(){
            
        }
    </script>
</body>
</html>
